name: kazi-ai
owner: creova-gif

stack:
  language: ["typescript"]
  framework: ["react", "expo", "express"]

skill_groups:
  default: [engineering, product]
  conditional:
    design: [ui-ux]
    security: [security]

# null = no command detected -> agents must report NOT VERIFIED for that gate
verification:
  install: "pnpm install"
  lint: null
  typecheck: "npx tsc --noEmit"
  test: null
  build: null

integrations:
  github: true
  linear: false   # set true once the Linear connector is authorized

agent_runtime:
  required: false
  preferred: null
